<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 — CSS-селектори</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
             font-family: Arial, sans-serif; background: #eef4ff; color: #1e293b; }
      main { max-width: 640px; width: 100%; padding: 38px; border-radius: 18px;
             background: #fff; box-shadow: 0 15px 35px rgba(30,64,175,.12); }
      h1 { margin-top: 0; color: #1d4ed8; }
      a { display: inline-block; margin-top: 12px; padding: 13px 19px; color: #fff;
          background: #2563eb; border-radius: 9px; text-decoration: none; font-weight: bold; }
      a:hover, a:focus { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
      <h1>Лабораторна робота №2</h1>
      <p>Тема: CSS-селектори. Виконання 16 завдань із використанням CSS.</p>
      <p>Виконав: Павлов Іван</p>
      <a href="lab2.html">Відкрити лабораторну роботу №2</a>
    </main>
</body>
</html>
